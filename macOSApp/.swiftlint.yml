# SwiftLint configuration for macOSApp.
#
# Minimal scaffold — pinned to swiftlint 0.63.2 via /mise.toml. Rule curation
# is intentionally a follow-up: this file exists so `mise run lint:swift`
# has something to read against default rules without flagging generated
# project bundles.
#
# Docs: https://github.com/realm/SwiftLint/blob/main/README.md#rules

included:
  - macOSApp

excluded:
  - macOSApp.xcodeproj   # generated by xcodegen
  - DerivedData
  - .build
