# Reachable — KMMBridge configuration (CLAUDE.md §9).
#
# KMMBridge (Touchlab) packages the Apple XCFramework as a Maven artifact and
# generates a Package.swift that points SPM at the Maven-hosted zip. This file
# centralises the deployment-target knobs that KMMBridge reads at config time
# without requiring matching Gradle property declarations on every invocation.
#
# All other KMMBridge wiring lives in `reachable/build.gradle.kts` under the
# `kmmbridge { }` block — this file is properties-only (key=value, no Kotlin).

# Apple deployment targets baked into the generated Package.swift. KMMBridge
# inserts these as the SwiftPackage `platforms:` entries; consumers' apps
# inherit them. Match `gradle/libs.versions.toml`:
#   ios-deployment-target  = 18.0
#   macos-deployment-target = 15.0
SPM_IOS_MIN_VERSION=18.0
SPM_MACOS_MIN_VERSION=15.0
