# =============================================================================
# Reachable — single source of truth for dependency versions (CLAUDE.md §10).
#
# IMPORTANT (CLAUDE.md §2 / §12): before bumping any version, web-search the
# latest stable. Versions in training data go stale fast. Stable only on `main`
# (no EAP / RC / Beta). The Kotlin pin is bounded above by SKIE's supported
# range — do not bump Kotlin past what SKIE supports.
# =============================================================================

[versions]

# --- Toolchain --------------------------------------------------------------
# Kotlin 2.4.10 is the highest version SKIE 0.10.14 supports. CLAUDE.md §8: "If
# SKIE doesn't yet support a Kotlin version, we wait. Don't bump Kotlin past
# SKIE's supported range." This is a paired bump — verify SKIE's changelog names
# the target Kotlin before raising either pin. (2.4.20 exists only as Beta, so
# it's out under the no-pre-release rule regardless of what SKIE supports.)
kotlin = "2.4.10"
agp = "9.3.1"                  # com.android.kotlin.multiplatform.library variant (CLAUDE.md §2).
skie = "0.10.14"               # Adds Kotlin 2.4.10 support (changelog 2026-07-27).
kmmbridge = "1.2.1"            # XCFramework → GitHub Release asset → SPM (CLAUDE.md §9).
dokka = "2.2.0"                # Kotlin API doc generator; Dokka v2 task layout.
# vanniktech's gradle-maven-publish-plugin — publishes signed artifacts to the
# Sonatype Central Portal (central.sonatype.com). 0.36.0 is the first release
# that pins the JDK17 / Gradle 9 / AGP 9 floor we're already on, and the first
# to officially support com.android.kotlin.multiplatform.library publications.
# There is no official Sonatype-published Gradle plugin in 2026; this is the
# community-recommended path. Coexists with KMMBridge — each plugin owns its
# own repository (vanniktech adds mavenCentral, KMMBridge adds GitHubPackages)
# and its own publish-umbrella task, so there's no cross-contamination.
mavenPublish = "0.37.0"

# --- Android SDK ------------------------------------------------------------
android-compile-sdk = "36"
android-min-sdk = "30"         # arm64-v8a only (CLAUDE.md §1).
jvm-target = "21"              # CLAUDE.md §2.

# --- Apple deployment targets ----------------------------------------------
ios-deployment-target = "18.0"
macos-deployment-target = "15.0"

# --- kotlinx ----------------------------------------------------------------
kotlinx-coroutines = "1.11.0"
kotlinx-atomicfu = "0.33.0"

# --- Other libraries --------------------------------------------------------
# androidx.startup — lets the library auto-attach its `Reachability.shared`
# singleton during the InitializationProvider ContentProvider pass, before
# Application.onCreate. Tiny dep (~6 KB), shipped as an `implementation` of
# :reachable so consumers don't need to add it themselves.
androidx-startup = "1.2.0"

# --- Sample-app deps (apps/android only — iOS / macOS samples consume via SPM) -
androidx-activity-compose = "1.13.0"
androidx-lifecycle-runtime-compose = "2.11.0"
androidx-compose-bom = "2026.06.01"

# --- Testing ----------------------------------------------------------------
turbine = "1.2.1"

# --- Lint ------------------------------------------------------------------
ktlint = "1.8.0"               # The ktlint tool itself.
ktlintGradle = "14.2.0"        # The org.jlleitschuh.gradle.ktlint Gradle plugin.
# detekt 1.23.8 is the latest stable; the 2.x line is alpha-only as of
# June 2026 and CLAUDE.md §2 bans pre-stable on main.
detekt = "1.23.8"


[libraries]

# --- kotlinx ----------------------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }

# --- Other ------------------------------------------------------------------
# androidx.startup runtime — consumed in :reachable's androidMain to host the
# bundled `ReachabilityInitializer`. See `androidx-startup` version above.
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }

# --- Gradle plugin artifacts (build-logic only) ------------------------------
# Compile-classpath dependencies for the precompiled convention plugins under
# /build-logic. Same version refs as the [plugins] aliases below, so the main
# build and build-logic can never apply different plugin versions.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
# SKIE's plugin marker artifact — resolves to the real plugin jar without
# hard-coding Touchlab's internal artifact name.
skie-gradle-plugin = { module = "co.touchlab.skie:co.touchlab.skie.gradle.plugin", version.ref = "skie" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
vanniktech-maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

# --- Testing ----------------------------------------------------------------
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# --- Sample-app deps --------------------------------------------------------
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle-runtime-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
# These come from the BOM — no version refs.
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }


[plugins]

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Compose Compiler plugin shipped by Kotlin since 2.0; pin matches `kotlin`.
# AGP 9.0+ ships Kotlin support built in, so no separate `kotlin.android` alias.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# Standard AGP application plugin for the Android sample app (separate from
# the multiplatform-library variant used by :reachable).
android-application = { id = "com.android.application", version.ref = "agp" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
# kmmbridge-github — applied in reachable/build.gradle.kts. Publishes the
# SKIE-enhanced Reachable.xcframework zip as a GitHub *Release* asset (public,
# unauthenticated download — unlike GitHub Packages, which requires a PAT even
# on public repos) and regenerates the root Package.swift to reference it by
# URL + checksum. See the `kmmbridge { }` block in reachable/build.gradle.kts
# and the SPM steps in .github/workflows/release.yml.
# The kmmbridge-github artifact is a superset of the core kmmbridge plugin
# in 1.2.x — applying both produces a duplicate-extension error.
kmmbridge-github = { id = "co.touchlab.kmmbridge.github", version.ref = "kmmbridge" }
# Vanniktech Maven Publish — Maven Central Portal upload + GPG signing + sources/
# javadoc jars + POM-metadata DSL. See `mavenPublishing { }` in
# reachable/build.gradle.kts for the configuration.
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
