name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (e.g. 0.2.0)
        required: true
        type: string
      notes:
        description: Release notes for GitHub Releases (optional; auto-generated if empty)
        required: false
        type: string

# `contents: write` lets the workflow commit the regenerated Package.swift
# back to main and push the version tag. `packages: write` lets KMMBridge push
# the XCFramework zip to GitHub Packages as a Maven artifact (CLAUDE.md §9).
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the workflow can rebase the Package.swift commit on
          # top of `main` cleanly.
          fetch-depth: 0
          # Token with `contents: write` so the post-publish git commit + push
          # for Package.swift authenticates correctly.
          token: ${{ github.token }}

      - name: Derive release metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "TAG=v${INPUT_VERSION}" >> "$GITHUB_ENV"

      - name: Configure git for release commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KMMBridge does the whole pipeline:
      #   1. Builds Reachable.xcframework via assembleReachableXCFramework.
      #   2. Zips it and publishes the zip + .module metadata to GitHub Packages
      #      (the maven-publish + addGithubPackagesRepository wiring in
      #      reachable/build.gradle.kts handles auth via GITHUB_TOKEN).
      #   3. Generates Package.swift at the repo root pointing SPM at the zip
      #      via URL + sha256.
      #   4. Commits Package.swift and pushes the version tag back to origin.
      #
      # `kmmBridgePublish` is the umbrella task that runs all of the above. The
      # `-Pversion=...` override drives the Maven coordinate version, the
      # SwiftPackage version, and the git tag.
      - name: Publish via KMMBridge
        env:
          # `gh` CLI calls below need the standard GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ github.token }}
          # KMMBridge's `addGithubPackagesRepository()` helper reads these env
          # names verbatim. The publish-token must have `write:packages` scope —
          # the workflow-level `permissions: packages: write` grants it.
          GITHUB_PUBLISH_USER: ${{ github.actor }}
          GITHUB_PUBLISH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :reachable:kmmBridgePublish \
            -Pversion=${{ inputs.version }} --no-daemon

      # Belt-and-suspenders: also stash the XCFramework zip on the GitHub
      # Release page so consumers who haven't wired up GitHub Packages can
      # still drop the framework in directly. Same artifact, same checksum.
      - name: Locate published XCFramework zip
        id: zip
        run: |
          ZIP=$(ls reachable/build/kmmbridge/zip/*.zip | head -1)
          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found zip: $ZIP"

      - name: Compute archive checksum
        run: |
          shasum -a 256 "${{ steps.zip.outputs.ZIP }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reachable-release-${{ env.TAG }}
          path: |
            ${{ steps.zip.outputs.ZIP }}
            SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ env.TAG }}
          NOTES: ${{ inputs.notes }}
          ZIP: ${{ steps.zip.outputs.ZIP }}
        run: |
          ASSETS=("$ZIP" SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          elif [[ -n "$NOTES" ]]; then
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --generate-notes
          fi
