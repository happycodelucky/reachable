name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # mise pins the JDK, Gradle bootstrap binary, xcodegen, gh, python, and
      # the Swift tooling (see /mise.toml). One install gives CI and local dev
      # the same toolchain. setup-gradle below is layered on top purely for
      # its dependency + build cache — mise has no equivalent.
      - name: Set up mise toolchain
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Read major.minor from the in-tree fallback literal in build.gradle.kts
      # (the `getOrElse("X.Y.0-SNAPSHOT")` argument) and stamp the patch with
      # the CI run number. Humans bump major/minor in build.gradle.kts; CI
      # never writes back. Mirrors the pattern used by other repos in this org.
      - name: Compute version
        id: version
        run: |
          MAJOR_MINOR=$(grep -oE 'getOrElse\("[0-9]+\.[0-9]+' build.gradle.kts | head -1 | cut -d'"' -f2)
          if [[ -z "$MAJOR_MINOR" ]]; then
            echo "Could not parse major.minor from build.gradle.kts" >&2
            exit 1
          fi
          VERSION="${MAJOR_MINOR}.0-ci.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed CI version: $VERSION"

      # `mise run check` runs ktlint + every unit test on every target
      # (iosSimulatorArm64Test, macosArm64Test, testAndroidHostTest).
      # `mise run build` produces the KMMBridge-consumable XCFramework
      # (CLAUDE.md §9). The CI version stamp is passed through to Gradle via
      # ORG_GRADLE_PROJECT_version — the standard env-var form of `-Pversion=…`
      # so the mise tasks don't need to know CI is the caller.
      - name: Build, test, and assemble XCFramework
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.version.outputs.VERSION }}
        run: |
          mise run check
          mise run build

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: Reachable-${{ steps.version.outputs.VERSION }}.xcframework
          path: reachable/build/XCFrameworks/release/Reachable.xcframework
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ steps.version.outputs.VERSION }}
          path: |
            reachable/build/reports/tests/
            reachable/build/reports/ktlint/
          if-no-files-found: ignore
