# Reachable docs site (CLAUDE.md §10).
#
# Source of truth for docs structure. Auto-discovery is deliberately disabled —
# explicit `nav:` keeps page ordering deterministic.
#
# Build:
#   .venv/bin/mkdocs serve   # local preview at http://localhost:8000
#   .venv/bin/mkdocs build --strict   # fails on broken internal links / nav drift

site_name: Reachable
site_description: A small Kotlin Multiplatform reachability library.
site_url: https://happycodelucky.github.io/reachable/
repo_name: happycodelucky/reachable
repo_url: https://github.com/happycodelucky/reachable
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Paul Bates

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link        # link Android/iOS/macOS tabs across pages
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  # Core
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  # PyMdown — same set as Backgrounder.
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/happycodelucky/reachable

# Explicit nav — never auto-discovered. Page ordering matters; this file is the truth.
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Installation: installation.md
  - Concepts:
    - concepts/api-design.md
    - concepts/lifecycle.md
    - concepts/validated-vs-available.md
  - Recipes:
    - recipes/swiftui-binding.md
    - recipes/compose-binding.md
    - recipes/react-to-changes.md
    - recipes/captive-portal.md
  - Platforms:
    - platforms/ios.md
    - platforms/macos.md
    - platforms/android.md
  - Contributing: contributing.md
  - Changelog: changelog.md

# Strict mode: fail the build on a broken link or a dead anchor.
strict: true
